<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Day 4</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <header>
    <h1>QuickNotes Editor</h1>
    <button id="theme-toggle" type="button">Dark mode</button>
  </header>

  <main>
    <div class="editor-section">
      <label for="note-text">Write your note:</label>
      <textarea id="note-text" placeholder="Start typing your note here..."></textarea>
      
      <div class="stats-bar">
        <p id="char-count">0 / 200 characters</p>
        <p id="word-count">0 words</p>
      </div>

      <button id="clear-btn" type="button">Clear</button>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 QuickNotes. All rights reserved.</p>
  </footer>

</body>
</html>
